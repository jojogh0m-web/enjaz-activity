<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>إنجاز التعليمية | أبطال حرف الجيم</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:14px;background:#fff9f0;color:#563a24;font-family:Tahoma,Arial,sans-serif}
main{max-width:900px;margin:auto}
.stars{text-align:center;font-size:27px;letter-spacing:7px;margin:0 0 8px;color:#f4bd45}
.sky{display:block;width:100%;height:auto;max-height:none;object-fit:contain;object-position:center;border-radius:15px;border:2px solid #f3d8c3}
.heading{text-align:center;padding:11px 8px 7px}
.brand{font-size:19px;font-weight:900;color:#b87835}
h1{font-size:clamp(23px,4vw,32px);margin:6px 0;color:#70401f}
.sub{font-size:17px;font-weight:700;color:#70401f}
.scoreline{display:flex;align-items:center;justify-content:space-between;gap:10px;font-weight:900;margin:12px 3px 7px}
.score{background:#ffedb5;border:2px solid #f7d58a;border-radius:30px;padding:7px 17px}
.progress{height:11px;background:#f3e2cb;border-radius:30px;overflow:hidden}
.fill{height:100%;width:0;background:#e8b85b;transition:width .25s}
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:14px}
.card{background:#fff;border:2px solid #f3d29b;border-radius:17px;padding:12px;text-align:center;box-shadow:0 3px 7px #9a6a2515;min-width:0}
.pic{font-size:clamp(38px,7vw,55px);background:#fff5e7;border-radius:13px;padding:5px}
.word{font-size:clamp(25px,4vw,32px);font-weight:900;min-height:45px;margin:8px 0;direction:rtl;color:#30251e}
.blank{display:inline-block;min-width:37px;border-bottom:3px dashed #e8a23b;color:#d18b21}
.hint{font-size:12px;color:#a58b72;margin:3px 0 7px}
.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}
.choice{border:2px solid #f4d49c;background:#fff3dc;color:#75421e;border-radius:12px;padding:9px 3px;font-size:25px;font-weight:900;cursor:pointer}
.choice:hover{background:#ffebc5}
.choice:focus-visible{outline:3px solid #4c91cf;outline-offset:2px}
.choice:disabled{opacity:.72;cursor:default}
.choice.wrong{background:#ffe6e2;border-color:#df8a7e;color:#a84237}
.feedback{min-height:22px;font-size:13px;font-weight:900;color:#26945e;margin-top:5px}
.message{text-align:center;min-height:25px;margin:14px 0;font-weight:800}
.finish{display:none;text-align:center;background:#e4f8e9;color:#167747;border-radius:18px;padding:20px;margin-top:14px}
.finish.show{display:block}
button.restart{background:#18834d;color:white;border:0;border-radius:13px;padding:12px 20px;font-size:16px;font-weight:bold;cursor:pointer;margin-top:10px}
footer{text-align:center;font-size:12px;color:#b18b69;margin:13px}
@media(max-width:390px){body{padding:8px}.cards{gap:7px}.card{padding:8px}.choice{font-size:22px;padding:8px 2px}}
</style>
</head>
<body>
<main>
<div class="stars">⭐ 🌟 ⭐ 🌟 ⭐</div>

<header class="heading">
 <div class="brand">🌼 إنجاز التعليمية 🌼</div>
 <h1>أبطال حرف الجيم (ج)</h1>
 <div class="sub">هيا نكمل الكلمات ونستمتع بالتعلم</div>
</header>
<div class="scoreline"><span>⭐ نتيجتك</span><span class="score" id="score">٠ من ٦</span></div>
<div class="progress"><div class="fill" id="fill"></div></div>
<div class="cards" id="cards"></div>
<div class="finish" id="finish">
 <div style="font-size:50px">🏆🎉🌟</div>
 <div style="font-size:30px;font-weight:900">أحسنت يا بطل!</div>
 <div style="font-size:26px;font-weight:900;margin:8px">إنجاز</div>
 <div>لقد أكملت جميع الكلمات بنجاح!</div>
 <div style="font-size:27px;margin:10px">⭐⭐⭐⭐⭐⭐</div>
 <button class="restart" id="again">🔄 العب مرة أخرى</button>
</div>
<div class="message" id="message" aria-live="polite">💡 اختر شكل حرف الجيم المناسب لإكمال كل كلمة</div>
<footer>🌈 نتعلم ونمرح مع إنجاز 🌈</footer>
</main>
<script>
(()=>{
const data=[
 {pic:'🐪',before:'',after:'مل',answer:'جـ',options:['جـ','ـجـ','ـج','ج'],word:'جمل'},
 {pic:'🐔',before:'د',after:'اجة',answer:'جـ',options:['ـجـ','جـ','ج','ـج'],word:'دجاجة'},
 {pic:'🌳',before:'ش',after:'رة',answer:'ـجـ',options:['جـ','ـج','ج','ـجـ'],word:'شجرة'},
 {pic:'🧊',before:'ثل',after:'',answer:'ـج',options:['ج','ـج','جـ','ـجـ'],word:'ثلج'},
 {pic:'🥕',before:'',after:'زر',answer:'جـ',options:['ـجـ','ج','جـ','ـج'],word:'جزر'},
 {pic:'👑',before:'تا',after:'',answer:'ج',options:['ـج','جـ','ج','ـجـ'],word:'تاج'}
];
let done=new Set(),audio;
const cards=document.getElementById('cards');
const ar=n=>['٠','١','٢','٣','٤','٥','٦'][n];
function sound(good){
 try{
  const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
  audio=audio||new AC();if(audio.state==='suspended')audio.resume();
  const now=audio.currentTime,notes=good?[523,659,784,1047]:[220,165];
  notes.forEach((freq,i)=>{
   const t=now+i*(good?.13:.16),o=audio.createOscillator(),g=audio.createGain();
   o.type=good?'sine':'triangle';o.frequency.value=freq;
   g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.14,t+.025);g.gain.exponentialRampToValueAtTime(.0001,t+.23);
   o.connect(g);g.connect(audio.destination);o.start(t);o.stop(t+.24);
  });
 }catch(e){}
}
function render(){
 cards.innerHTML='';
 data.forEach((q,i)=>{
  const card=document.createElement('section');card.className='card';
  const pic=document.createElement('div');pic.className='pic';pic.textContent=q.pic;
  const word=document.createElement('div');word.className='word';
  if(done.has(i)){word.textContent=q.word}
  else{
   word.append(document.createTextNode(q.before));
   const blank=document.createElement('span');blank.className='blank';blank.textContent='';
   word.append(blank,document.createTextNode(q.after));
  }
  const hint=document.createElement('div');hint.className='hint';hint.textContent=done.has(i)?'أحسنت! 🌟':'أكمل الكلمة';
  const choices=document.createElement('div');choices.className='choices';
  q.options.forEach(op=>{
   const b=document.createElement('button');b.className='choice';b.textContent=op;b.disabled=done.has(i);
   b.addEventListener('click',()=>{
    if(done.has(i))return;
    if(op===q.answer){
     done.add(i);sound(true);document.getElementById('message').textContent='🎉 رائع! إجابة صحيحة، أحسنت!';
     render();
     if(done.size===6){document.getElementById('finish').classList.add('show');document.getElementById('message').textContent='🌟 بطل الإنجاز!'}
    }else{
     sound(false);b.classList.add('wrong');
     document.getElementById('message').textContent='💛 حاول مرة أخرى، أنت تستطيع!';
     setTimeout(()=>b.classList.remove('wrong'),550);
    }
   });
   choices.append(b);
  });
  const feedback=document.createElement('div');feedback.className='feedback';feedback.textContent=done.has(i)?'✓ ممتاز!':'';
  card.append(pic,word,hint,choices,feedback);cards.append(card);
 });
 document.getElementById('score').textContent=ar(done.size)+' من ٦';
 document.getElementById('fill').style.width=(done.size/6*100)+'%';
}
document.getElementById('again').addEventListener('click',()=>{
 done.clear();document.getElementById('finish').classList.remove('show');
 document.getElementById('message').textContent='💡 اختر شكل حرف الجيم المناسب لإكمال كل كلمة';render();
});
render();
})();
</script>
